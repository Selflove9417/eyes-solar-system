<meta property="og:description" content="太阳、行星、矮行星与主要卫星的规范中文名称及简介，中文内容译自 NASA/JPL 官方 descriptions 数据并逐条标注来源。">

<body>
<main class="wrap">
  <h1>天体中文名与简介</h1>
  <p class="lede">天体的中文名称与简介，译自 NASA 官方资料，数字与单位保持原样。<a href="about.html#sources" class="lede-link">数据说明 ↗</a></p>
  <div class="toolbar">
    <input type="search" id="filter" placeholder="按中文名、英文名或类别筛选…" aria-label="筛选天体">
    <span id="count" style="color:var(--fg-dim);font-size:13.5px"></span>
  </div>
  <p style="color:var(--fg-muted);font-size:13px;margin:8px 0 20px">注：未特别标注的天体均采用国家审定规范译名；标注「通用译名」为中文出版物通行译名，「代号保留」为国际编号原文。</p>
  <div class="entry-grid" id="list"></div>
  <p style="margin-top:40px;color:var(--fg-muted);font-size:13.5px;border-top:1px solid var(--line-subtle);padding-top:20px">
    未收录的天体（官方实体库共 719 条，其中卫星 451 条）暂无可靠中文译名，在模拟器中保留英文。完整名单见<a href="glossary.html" style="color:var(--fg-dim);text-decoration:underline">中英术语对照</a>。
  </p>
</main>
<script type="module">
import { renderChrome, getData, el } from './assets/js/site.js?v=20261015p5b';
renderChrome('bodies.html');
const { bodies, names } = await getData();
const list = document.getElementById('list');
const count = document.getElementById('count');

function getSwatchClass(cat) {
  if (cat === 'Planet') return 'swatch-planet';
  if (cat === 'Moon') return 'swatch-moon';
  if (cat === 'Dwarf Planet') return 'swatch-dwarf';
  if (cat === 'Star') return 'swatch-star';
  if (cat === 'Asteroid' || cat === 'Comet') return 'swatch-smallbody';
  return 'swatch-planet';
}

function statusTag(status) {
  if (status === 'common') return el('span', { class: 'entry-status-note' }, '通用译名');
  if (status === 'code') return el('span', { class: 'entry-status-note' }, '代号保留');
  return null;
}

function render(q = '') {
  const needle = q.trim().toLowerCase();
  const hits = bodies.bodies.filter((b) => {
    if (!needle) return true;
    const entry = names.entities[b.id];
    return [b.zh, entry?.en, b.en, b.cat, names.categories[b.cat], b.id].join(' ').toLowerCase().includes(needle);
  });
  count.textContent = `显示 ${hits.length} / ${bodies.bodies.length} 条`;
  list.replaceChildren(...hits.map((b) => {
    const entry = names.entities[b.id];
    const catZh = names.categories[b.cat] || b.cat || names.categories[entry?.cat] || entry?.cat || '';
    const enTitle = entry?.en || b.id;
    const card = el('article', { class: 'entry-card' },
      el('div', { class: `entry-swatch ${getSwatchClass(b.cat)}` }),
      el('h3', { class: 'entry-title' }, b.zh || b.id, entry ? statusTag(entry.status) : null),
      el('div', { class: 'entry-en' }, (catZh ? catZh + ' · ' : '') + enTitle),
      el('p', { class: 'entry-desc' }, b.zhl || '官方未提供该条目的简介文本。'),
      b.src
        ? el('details', { class: 'entry-details' },
            el('summary', {}, '英文原文'),
            el('p', {}, b.en))
        : null,
      el('div', { class: 'entry-actions' },
        el('a', { href: `explore.html#${b.id}`, class: 'entry-action-primary' }, '在 3D 探索中打开 →'),
        SPECIAL_TOPICS[b.id] ? el('a', { href: SPECIAL_TOPICS[b.id].url, class: 'entry-action-secondary' }, SPECIAL_TOPICS[b.id].text) : null,
        b.src ? el('a', { href: b.src, target: '_blank', rel: 'noopener', class: 'entry-action-source' }, '官方来源 ↗') : null),
    );
    return card;
  }));
}
const SPECIAL_TOPICS = {
  mars: { url: 'mars.html', text: '火星深度特写 ↗' },
  saturn: { url: 'saturn.html', text: '土星深度特写 ↗' },
  titan: { url: 'saturn.html', text: '土卫六特写 ↗' },
  enceladus: { url: 'saturn.html', text: '土卫二特写 ↗' },
  phobos: { url: 'mars.html', text: '火卫一特写 ↗' },
};
document.getElementById('filter').addEventListener('input', (e) => render(e.target.value));
render();
</script>
</body>
</html>
