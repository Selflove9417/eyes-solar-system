<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中英术语对照 · 深空之眸</title>
<meta name="description" content="NASA Eyes 实体库与界面字符串的中英术语对照表，标明每条译名的依据等级与未汉化范围。">

<meta property="og:title" content="中英术语对照 · 深空之眸">

<meta name="twitter:title" content="中英术语对照 · 深空之眸">

<meta name="twitter:image" content="assets/img/PIA21895_final_image.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.ico">
<link rel="stylesheet" href="assets/css/main.css?v=20261015p6">
</head>
<body>
<main class="wrap">
  <h1>中英术语对照</h1>
  <p class="lede">站点与汉化扩展共用的中英术语对照。<a href="about.html#sources" class="lede-link">数据说明 ↗</a></p>

  <div class="glossary-overview" id="coverage">
    <div class="overview-line">
      <span id="coverage-core">统计加载中…</span>
      <details class="overview-details">
        <summary>查看统计与规则</summary>
        <div class="overview-content" id="coverage-extra"></div>
      </details>
    </div>
  </div>

  <div class="tab-nav" role="tablist">
    <button class="tab-btn" type="button" data-tab="entities" aria-pressed="true" role="tab">实体名称</button>
    <button class="tab-btn" type="button" data-tab="ui" aria-pressed="false" role="tab">界面字符串</button>
    <button class="tab-btn" type="button" data-tab="missing" aria-pressed="false" role="tab">未收录条目（保留英文）</button>
  </div>

  <div id="pane-entities">
    <div class="toolbar">
      <input type="search" id="f-ent" placeholder="筛选实体：中文名 / 英文名 / id / 类别…" aria-label="筛选实体">
      <select id="f-status" class="select-control" aria-label="筛选译名等级">
        <option value="">全部译名等级</option>
        <option value="std">规范译名</option>
        <option value="common">通用译名</option>
        <option value="code">代号保留</option>
      </select>
      <span id="c-ent" style="color:var(--fg-dim);font-size:13.5px"></span>
    </div>
    <div class="table-container">
      <table><thead><tr><th>中文</th><th>站点英文名</th><th>类别</th><th class="col-id">id（稳定键名）</th><th>依据</th></tr></thead>
      <tbody id="t-ent"></tbody></table>
    </div>
  </div>

  <div id="pane-ui" hidden>
    <div class="toolbar">
      <input type="search" id="f-ui" placeholder="筛选界面字符串…" aria-label="筛选界面字符串">
      <span id="c-ui" style="color:var(--fg-dim);font-size:13.5px"></span>
    </div>
    <div class="table-container">
      <table><thead><tr><th>站点原文</th><th>中文</th></tr></thead><tbody id="t-ui"></tbody></table>
    </div>
    <h2>不翻译的内容</h2>
    <ul id="not-translated"></ul>
  </div>

  <div id="pane-missing" hidden>
    <p style="color:var(--fg-dim)">以下条目存在于官方实体库，但本站未建立中文对照，在模拟器与官方站点中一律<strong style="color:var(--warn)">保留英文</strong>。</p>
    <div class="toolbar">
      <input type="search" id="f-mis" placeholder="筛选…" aria-label="筛选未收录条目">
      <span id="c-mis" style="color:var(--fg-dim);font-size:13.5px"></span>
    </div>
    <div class="table-container">
      <table><thead><tr><th>英文名</th><th>类别</th><th class="col-id">id</th></tr></thead><tbody id="t-mis"></tbody></table>
    </div>
  </div>
</main>
<script type="module">
import { renderChrome, getData, el } from './assets/js/site.js?v=20261015p6';
renderChrome('glossary.html');
const { names, ui, entityById } = await getData();

const covered = Object.keys(names.entities).length;
const total = names.meta.totalEntities;
const byStatus = Object.values(names.entities).reduce((a, e) => ((a[e.status] = (a[e.status] || 0) + 1), a), {});
const uiCount = Object.keys(ui.ui).length;
const unrecorded = total - covered;

document.getElementById('coverage-core').innerHTML =
  `官方实体库 <strong>${total}</strong> 条，已建立中文对照 <strong>${covered}</strong> 条（${(covered / total * 100).toFixed(1)}%）`;
document.getElementById('coverage-extra').innerHTML =
  `<p style="margin:4px 0">译名等级分布：规范译名 ${byStatus.std || 0} 条 · 通用译名 ${byStatus.common || 0} 条 · 代号保留 ${byStatus.code || 0} 条 · <strong style="color:var(--warn)">未收录 ${unrecorded} 条（在模拟器中保留英文）</strong>。</p>` +
  `<p style="margin:4px 0">界面字符串：<strong>${uiCount}</strong> 条已收录，全部来自加载完成页面的实测采集。</p>` +
  `<p style="margin:4px 0">命名规则：英文名取自官方数据，规则为 <code>displayName || iauName</code>（与站点渲染标签逐条核对一致）。</p>`;

const tbody = (id) => document.getElementById(id);
const LABEL = { std: '规范译名', common: '通用译名', code: '代号保留' };

function statusLabel(status) {
  return el('span', { class: `status-text ${status || ''}` }, LABEL[status] || status || '');
}

function renderEnt() {
  const q = document.getElementById('f-ent').value.trim().toLowerCase();
  const normQ = q.replace(/韦布/g, '韦伯');
  const st = document.getElementById('f-status').value;
  const rows = Object.entries(names.entities)
    .filter(([id, e]) => {
      if (st && e.status !== st) return false;
      if (!q) return true;
      const zhNorm = (e.zh || '').replace(/韦布/g, '韦伯').toLowerCase();
      const catZh = (names.categories[e.cat] || '').toLowerCase();
      const aliases = (e.aliases || []).join(' ').toLowerCase();
      const full = [e.zh, e.en, e.cat, id].join(' ').toLowerCase();
      return full.includes(q) || zhNorm.includes(normQ) || catZh.includes(q) || aliases.includes(q);
    })
    .sort((a, b) => (a[1].cat || '').localeCompare(b[1].cat || '') || a[1].zh.localeCompare(b[1].zh, 'zh'));
  tbody('t-ent').replaceChildren(...rows.map(([id, e]) => el('tr', {},
    el('td', {}, e.zh), el('td', {}, e.en), el('td', {}, names.categories[e.cat] || e.cat || ''),
    el('td', { class: 'mono col-id' }, id), el('td', {}, statusLabel(e.status)))));
  document.getElementById('c-ent').textContent = `显示 ${rows.length} / ${covered} 条`;
}

function renderUi() {
  const q = document.getElementById('f-ui').value.trim().toLowerCase();
  const rows = Object.entries(ui.ui)
    .filter(([k, v]) => !q || (k + ' ' + v).toLowerCase().includes(q))
    .sort((a, b) => a[0].localeCompare(b[0]));
  tbody('t-ui').replaceChildren(...rows.map(([k, v]) =>
    el('tr', {}, el('td', { class: 'mono' }, k), el('td', {}, v))));
  document.getElementById('c-ui').textContent = `显示 ${rows.length} / ${Object.keys(ui.ui).length} 条`;
  document.getElementById('not-translated').replaceChildren(
    ...ui.meta.notTranslated.map((t) => el('li', {}, t)));
}

function renderMissing() {
  const q = document.getElementById('f-mis').value.trim().toLowerCase();
  const rows = [...entityById.values()]
    .filter((e) => !names.entities[e.id])
    .filter((e) => !q || [e.displayName || e.iauName, e.category, names.categories[e.category], e.id].join(' ').toLowerCase().includes(q))
    .sort((a, b) => (a.category || '').localeCompare(b.category || '') ||
      (a.displayName || a.iauName || '').localeCompare(b.displayName || b.iauName || ''));
  tbody('t-mis').replaceChildren(...rows.map((e) => el('tr', {},
    el('td', {}, e.displayName || e.iauName || e.id),
    el('td', {}, names.categories[e.category] || e.category || ''), el('td', { class: 'mono col-id' }, e.id))));
  document.getElementById('c-mis').textContent = `显示 ${rows.length} / ${[...entityById.values()].filter((e) => !names.entities[e.id]).length} 条`;
}

document.getElementById('f-ent').addEventListener('input', renderEnt);
document.getElementById('f-status').addEventListener('change', renderEnt);
document.getElementById('f-ui').addEventListener('input', renderUi);
document.getElementById('f-mis').addEventListener('input', renderMissing);
renderEnt(); renderUi(); renderMissing();

const panes = { entities: 'pane-entities', ui: 'pane-ui', missing: 'pane-missing' };
document.querySelectorAll('[data-tab]').forEach((btn) => btn.addEventListener('click', () => {
  document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  for (const [k, id] of Object.entries(panes)) document.getElementById(id).hidden = k !== btn.dataset.tab;
}));
</script>
</body>
</html>
